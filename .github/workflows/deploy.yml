name: Deploy

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name mymisacr

      - name: Build and push image
        run: |
          IMAGE=mymisacr.azurecr.io/mymis-api:${{ github.sha }}
          docker build -t $IMAGE -f MyMIS.Api/Dockerfile MyMIS.Api
          docker push $IMAGE

      - name: Point Web App at the new image
        run: az webapp config container set --name mymis-api --resource-group mymis-rg --container-image-name mymisacr.azurecr.io/mymis-api:${{ github.sha }} --container-registry-url https://mymisacr.azurecr.io

      - name: Restart Web App
        run: az webapp restart --name mymis-api --resource-group mymis-rg
